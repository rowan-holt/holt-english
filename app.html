<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HOLT</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=2">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="HOLT">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@500;600&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>html,body{margin:0;height:100%;background:#fff;overflow:hidden;-webkit-tap-highlight-color:transparent}
#fr{position:fixed;left:0;right:0;top:0;bottom:calc(56px + env(safe-area-inset-bottom))}
#fr iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:#fff}
#fr iframe.on{display:block}
#tb{position:fixed;left:0;right:0;bottom:0;height:56px;padding-bottom:env(safe-area-inset-bottom);display:flex;background:#fff;border-top:1px solid #e6e6e6}
#tb .tl{display:contents}
#tb button{flex:1;border:0;background:none;padding:0;font:600 13px/1 Jost,sans-serif;letter-spacing:.09em;color:#6b6b6b;position:relative;cursor:pointer}
#tb button.on{color:#111}
#tb button.on::before{content:"";position:absolute;top:-1px;left:50%;width:28px;height:2px;margin-left:-14px;background:#111}
#tb #set{flex:0 0 56px;display:flex;align-items:center;justify-content:center;color:#555}
#sh{position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.42);display:flex;align-items:flex-end}
#sh[hidden]{display:none}
.in{width:100%;max-width:520px;margin:0 auto;background:#fff;border-radius:16px 16px 0 0;padding:22px 16px calc(14px + env(safe-area-inset-bottom));box-sizing:border-box;font-family:'Pretendard Variable',Pretendard,sans-serif}
.in h2{margin:0 0 4px;font-size:17px;font-weight:700;color:#111}
.in p{margin:0 0 10px;font-size:13px;color:#666}
.op{display:block;width:100%;text-align:left;margin-top:8px;padding:14px 16px;border:1px solid #e3e3e3;border-radius:12px;background:#fff;cursor:pointer;position:relative;color:#111}
.op b{display:block;font:600 15px/1.2 Jost,sans-serif;letter-spacing:.06em}
.op span{display:block;margin-top:4px;font-size:13px;color:#595959;font-family:'Pretendard Variable',Pretendard,sans-serif}
.op.on{border-color:#111;box-shadow:inset 0 0 0 1px #111}
.op.on::after{content:"✓";position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:16px}
#shx{display:block;width:100%;margin-top:6px;padding:14px;border:0;background:none;font-size:14px;color:#666;cursor:pointer}
#shx[hidden]{display:none}</style>
</head>
<body>
<div id="fr"></div>
<nav id="tb" aria-label="HOLT"><div class="tl" role="tablist" aria-label="HOLT 사이트"><button type="button" role="tab" aria-selected="false" data-k="news">NEWS</button><button type="button" role="tab" aria-selected="false" data-k="english">ENGLISH</button><button type="button" role="tab" aria-selected="false" data-k="issue">ISSUE</button></div><button type="button" id="set" aria-label="처음 볼 화면 설정"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button></nav>
<div id="sh" hidden><div class="in" role="dialog" aria-modal="true" aria-labelledby="sh-t">
<h2 id="sh-t">처음 볼 화면</h2><p>앱을 열면 이 화면부터 보여요. 언제든 ⚙에서 바꿀 수 있어요.</p><button type="button" class="op" data-k="news"><b>HOLT NEWS</b><span>뉴스·연구 해설</span></button><button type="button" class="op" data-k="english"><b>HOLT ENGLISH</b><span>뉴스 속 영어 표현</span></button><button type="button" class="op" data-k="issue"><b>HOLT ISSUE</b><span>읽고 푸는 시사상식</span></button>
<button type="button" id="shx">닫기</button></div></div>
<script>(function(){var HL;try{HL=localStorage.getItem('holt_lang')}catch(e){}if(!HL)HL=/^ko/i.test(navigator.language||'')?'ko':'en';if(HL!=='en')return;var E={"news": "News and research, explained", "english": "English from the news", "issue": "Read-and-solve current affairs"},q=function(s){return document.querySelector(s)};
document.documentElement.lang='en';q('#tb .tl').setAttribute('aria-label','HOLT sites');q('#set').setAttribute('aria-label','Choose start screen');
q('#sh-t').textContent='Start screen';q('#sh p').textContent='The app opens here first. Change it any time with ⚙.';q('#shx').textContent='Close';
document.querySelectorAll('#sh .op').forEach(function(b){b.querySelector('span').textContent=E[b.dataset.k]})})()</script>
<script>(function(){
var S={"news": "https://holtnews.com/", "issue": "https://issue.holtnews.com/", "english": "https://english.holtnews.com/"},fr=document.getElementById('fr'),sh=document.getElementById('sh'),F={},cur=null,first=false;
function get(){try{return localStorage.getItem('holt-app-start')}catch(e){return null}}
function put(k){try{localStorage.setItem('holt-app-start',k)}catch(e){}}
function keyOf(u){for(var k in S)if(u.indexOf(S[k])===0)return k;return null}
function frame(k,url){var f=F[k];if(!f){f=document.createElement('iframe');f.title='HOLT '+k.toUpperCase();f.src=url||S[k];fr.appendChild(f);F[k]=f}else if(url)f.src=url;return f}
function show(k,url){var f=frame(k,url);for(var j in F)F[j].classList.toggle('on',j===k);cur=k;
document.querySelectorAll('#tb [data-k]').forEach(function(b){var on=b.getAttribute('data-k')===k;b.classList.toggle('on',on);b.setAttribute('aria-selected',on)})}
function parse(){var m=/^#(news|issue|english)(\/.*)?$/.exec(location.hash);return m?{k:m[1],url:m[2]?S[m[1]]+m[2].slice(1):null}:null}
function fromHash(){var h=parse();if(!h)return false;show(h.k,h.url);if(h.url)history.replaceState(null,'','#'+h.k);return true}
addEventListener('hashchange',fromHash);
document.querySelectorAll('#tb [data-k]').forEach(function(b){b.addEventListener('click',function(){var k=b.getAttribute('data-k');
if(k===cur)frame(k,S[k]);else location.hash=k})});
addEventListener('message',function(ev){if(!/^https:\/\/(english\.|issue\.)?holtnews\.com$/.test(ev.origin))return;var d=ev.data;
if(!d||d.holt!=='go'||typeof d.url!=='string')return;var k=keyOf(d.url);if(!k)return;frame(k,d.url);if(k!==cur)location.hash=k});
function open(isFirst){first=isFirst;var p=get()||'news';sh.querySelectorAll('.op').forEach(function(o){var on=o.getAttribute('data-k')===p;o.classList.toggle('on',on);o.setAttribute('aria-pressed',on)});
document.getElementById('shx').hidden=isFirst;sh.hidden=false;var c=sh.querySelector('.op.on')||sh.querySelector('.op');c&&c.focus()}
sh.querySelectorAll('.op').forEach(function(o){o.addEventListener('click',function(){var k=o.getAttribute('data-k');put(k);
sh.querySelectorAll('.op').forEach(function(x){x.classList.toggle('on',x===o);x.setAttribute('aria-pressed',x===o)});
setTimeout(function(){sh.hidden=true;if(first){history.replaceState(null,'','#'+k);show(k)}},first?0:220)})});
document.getElementById('set').addEventListener('click',function(){open(false)});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&!sh.hidden&&!first){sh.hidden=true;document.getElementById('set').focus()}});
document.getElementById('shx').addEventListener('click',function(){sh.hidden=true});
sh.addEventListener('click',function(ev){if(ev.target===sh&&!first)sh.hidden=true});
if(!fromHash()){var p=get();p=(p&&S[p])?p:'news';history.replaceState(null,'','#'+p);show(p)}
})();</script>
</body>
</html>
